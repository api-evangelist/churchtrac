name: ChurchTrac
kind: company
description: ChurchTrac is all-in-one church management software (ChMS) for small and
  large churches, covering people and member management, church directory, groups,
  attendance and check-in, event registration, worship planning and volunteer
  scheduling, online giving, and fund accounting/budgeting. ChurchTrac does NOT
  publish a public or partner developer API - there is no documented REST API, API
  keys, OAuth, or webhooks for building against ChurchTrac data. Its "integrations"
  are ChurchTrac consuming third-party services (Stripe for giving, SendGrid/Mailchimp
  for email, Twilio for texting, QuickBooks for accounting, Zoom); member-facing
  access is via the Church Connect app and embeddable online giving forms, not a
  programmable API surface. This entry is documented as an honest stub.
